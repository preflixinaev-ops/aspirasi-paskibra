<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f1ea">
<meta name="description" content="Pencalonan Ketua Paskibra SMAN 1 Batujaya. Soliditas, Regenerasi, Kualitas Anggota.">
<meta property="og:title" content="FARID — Calon Ketua Paskibra SMAN 1 Batujaya">
<meta property="og:description" content="Soliditas, Regenerasi, Kualitas Anggota.">
<meta property="og:type" content="website">
<meta property="og:image" content="logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,300;1,9..144,400;1,9..144,700&family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>FARID — Calon Ketua Paskibra SMAN 1 Batujaya</title>
<style>
:root{
  /* === PALET EDITORIAL PORTFOLIO === */
  --bg:#f4f1ea;
  --bg-2:#eae6dc;
  --ink:#0f0f0f;
  --ink-2:#1a1a1a;
  --muted:#6b6560;
  --muted-2:#9a948c;
  --line:#d8d3c7;
  --line-2:#c4bdae;
  --accent:#ff5722;      /* oranye tegas */
  --accent-2:#0a1eff;    /* biru elektrik */
  --cream:#f4f1ea;
  --white:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  font-feature-settings:"ss01","cv11";
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
.wrap{width:min(1440px,calc(100% - 60px));margin:auto}
.serif{font-family:"Fraunces",Georgia,serif;font-weight:400;letter-spacing:-.03em}
.italic{font-style:italic;font-family:"Fraunces",Georgia,serif;font-weight:300}

/* === HEADER === */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:20px 0;
  mix-blend-mode:difference;
  color:#fff;
  pointer-events:none;
}
header *{pointer-events:auto}
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{
  display:flex;align-items:center;gap:12px;
  font-family:"Inter Tight";font-weight:800;font-size:14px;
  letter-spacing:.05em;text-transform:uppercase;
  color:#fff;
}
.brand-mark{
  width:34px;height:34px;border-radius:50%;
  background:#fff;color:#000;
  display:grid;place-items:center;
  font-family:"Fraunces";font-weight:700;font-size:15px;
  overflow:hidden;
}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.navlinks{
  display:flex;align-items:center;gap:2px;
  font-size:13px;font-weight:600;letter-spacing:.02em;
}
.navlinks button{
  padding:8px 14px;border-radius:0;
  color:#fff;opacity:.7;transition:.2s;
  text-transform:uppercase;letter-spacing:.08em;font-size:11px;
  position:relative;
}
.navlinks button:hover{opacity:1}
.navlinks button.active{opacity:1}
.navlinks button.active:after{
  content:"";position:absolute;bottom:2px;left:14px;right:14px;
  height:1px;background:#fff;
}
.nav-meta{
  display:flex;align-items:center;gap:20px;
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
}
.nav-meta span{opacity:.6}
.nav-cta{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border:1px solid rgba(255,255,255,.4);
  border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:#fff;transition:.25s;
}
.nav-cta:hover{background:#fff;color:#000;border-color:#fff}
.navtoggle{
  display:none;width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.4);color:#fff;
  font-size:16px;place-items:center;
}

/* === VIEW === */
.view{display:none}
.view.active{display:block;animation:viewIn .6s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* === SECTION NUMBER BAR === */
.section-num{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:24px;
  padding:32px 0 20px;
  border-top:1px solid var(--ink);
}
.section-num .num{
  font-family:"Fraunces";font-weight:300;font-size:14px;
  letter-spacing:.08em;color:var(--ink);
}
.section-num .title-small{
  font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);
}
.section-num .meta{
  font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted-2);
}

/* === HERO === */
.hero{
  padding:140px 0 80px;
  min-height:100vh;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;
}
.hero-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);
}
.hero-title{
  margin:60px 0;
  font-family:"Fraunces";font-weight:400;
  font-size:clamp(64px,13vw,220px);
  line-height:.88;letter-spacing:-.055em;
  color:var(--ink);
  text-wrap:balance;
}
.hero-title .line{display:block;overflow:hidden}
.hero-title .italic-line{
  font-style:italic;font-weight:300;
  color:var(--accent);
}
.hero-title .outline{
  -webkit-text-stroke:2px var(--ink);
  color:transparent;
}
.hero-bottom{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px;
  padding-top:40px;border-top:1px solid var(--ink);
  align-items:end;
}
.hero-bottom .col h4{
  font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:12px;
}
.hero-bottom .col p{font-size:14px;line-height:1.6;color:var(--ink-2);max-width:320px}
.hero-scroll{
  display:inline-flex;align-items:center;gap:12px;
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink);
}
.hero-scroll .circle{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--ink);
  display:grid;place-items:center;
  animation:spin 8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* === BIG SECTION TITLE === */
.big-title{
  font-family:"Fraunces";font-weight:400;
  font-size:clamp(48px,9vw,140px);
  line-height:.9;letter-spacing:-.045em;
  color:var(--ink);
  margin:20px 0 60px;
  text-wrap:balance;
}
.big-title .italic{font-style:italic;font-weight:300;color:var(--accent)}
.big-title .outline{-webkit-text-stroke:2px var(--ink);color:transparent}

/* === LIST EDITORIAL === */
.editorial-list{border-top:1px solid var(--ink)}
.list-row{
  display:grid;grid-template-columns:60px 1fr 2fr 40px;
  gap:24px;align-items:start;
  padding:36px 0;
  border-bottom:1px solid var(--line);
  transition:.3s;
  position:relative;
  cursor:pointer;
}
.list-row:hover{padding-left:16px;padding-right:16px}
.list-row:hover .list-num{color:var(--accent)}
.list-row:hover .list-title{color:var(--accent)}
.list-num{
  font-family:"Fraunces";font-weight:300;
  font-size:14px;letter-spacing:.08em;color:var(--muted);
  transition:.3s;
}
.list-title{
  font-family:"Fraunces";font-weight:500;
  font-size:clamp(22px,3vw,36px);
  line-height:1.1;letter-spacing:-.03em;
  color:var(--ink);transition:.3s;
}
.list-desc{
  font-size:14px;line-height:1.7;color:var(--muted);
  max-width:520px;
}
.list-arrow{
  font-size:24px;color:var(--ink);opacity:.4;transition:.3s;
  align-self:center;
}
.list-row:hover .list-arrow{opacity:1;transform:translateX(6px);color:var(--accent)}

/* === VISI BLOCK === */
.visi-block{
  padding:80px 0;
  border-top:1px solid var(--ink);
}
.visi-block .label{
  font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:40px;
}
.visi-block .statement{
  font-family:"Fraunces";font-weight:400;
  font-size:clamp(28px,4.5vw,60px);
  line-height:1.15;letter-spacing:-.035em;
  color:var(--ink);max-width:1200px;
}
.visi-block .statement .italic{font-style:italic;font-weight:300;color:var(--accent)}
.visi-block .meta{
  display:grid;grid-template-columns:1fr 1fr;gap:60px;
  margin-top:60px;padding-top:40px;border-top:1px solid var(--line);
}
.visi-block .meta p{font-size:14px;line-height:1.75;color:var(--muted);max-width:520px}

/* === MISI GRID (editorial) === */
.misi-editorial{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:0;border-top:1px solid var(--ink);
}
.misi-editorial .item{
  padding:44px 40px;
  border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);
  transition:.3s;position:relative;
}
.misi-editorial .item:nth-child(2n){border-right:0}
.misi-editorial .item:hover{background:#f9f7f2}
.misi-editorial .item:hover .m-num{color:var(--accent)}
.m-num{
  font-family:"Fraunces";font-weight:300;
  font-size:13px;letter-spacing:.1em;color:var(--muted);
  margin-bottom:24px;display:block;transition:.3s;
}
.misi-editorial .item h4{
  font-family:"Fraunces";font-weight:500;
  font-size:clamp(20px,2.5vw,30px);
  line-height:1.15;letter-spacing:-.025em;
  color:var(--ink);margin-bottom:14px;
}
.misi-editorial .item p{font-size:14px;line-height:1.75;color:var(--muted);max-width:440px}

/* === STEP LIST === */
.step-editorial{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:0;border-top:1px solid var(--ink);
}
.step-editorial .step{
  padding:44px 40px;
  border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);
  position:relative;transition:.3s;
}
.step-editorial .step:last-child{border-right:0}
.step-editorial .step:hover{background:#f9f7f2}
.step-editorial .s-num{
  font-family:"Fraunces";font-weight:300;
  font-size:13px;letter-spacing:.1em;color:var(--muted);
  margin-bottom:40px;display:block;
}
.step-editorial .step h4{
  font-family:"Fraunces";font-weight:500;
  font-size:clamp(20px,2.2vw,28px);
  line-height:1.15;letter-spacing:-.025em;
  color:var(--ink);margin-bottom:14px;
}
.step-editorial .step p{font-size:14px;line-height:1.75;color:var(--muted);max-width:340px}

/* === DOKUMENTASI FULL BLEED === */
.doc-hero{
  display:grid;grid-template-columns:1fr 1fr;
  gap:0;border-top:1px solid var(--ink);
}
.doc-hero .doc-item{
  position:relative;overflow:hidden;
  aspect-ratio:1/1;cursor:pointer;
  background:var(--bg-2);
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.doc-hero .doc-item img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.22,1,.36,1);
  filter:grayscale(20%);
}
.doc-hero .doc-item:hover img{transform:scale(1.06);filter:grayscale(0)}
.doc-hero .doc-caption{
  position:absolute;left:24px;right:24px;bottom:24px;
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:16px;color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,.5);
}
.doc-hero .doc-caption h4{
  font-family:"Fraunces";font-weight:500;
  font-size:clamp(18px,2vw,26px);line-height:1.15;
  letter-spacing:-.02em;color:#fff;
}
.doc-hero .doc-caption .tag{
  font-size:10px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;
  padding:5px 10px;border:1px solid rgba(255,255,255,.6);
  border-radius:99px;
}
.doc-hero .doc-item:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.7) 0%,transparent 50%);
  pointer-events:none;
}

/* === FAQ EDITORIAL === */
.faq-editorial{border-top:1px solid var(--ink)}
.faq-editorial .faq-item{
  border-bottom:1px solid var(--line);
}
.faq-editorial summary{
  padding:32px 0;
  display:grid;grid-template-columns:60px 1fr 40px;
  gap:24px;align-items:center;
  cursor:pointer;list-style:none;
  transition:.2s;
}
.faq-editorial summary::-webkit-details-marker{display:none}
.faq-editorial summary::marker{display:none}
.faq-editorial summary:hover{padding-left:16px}
.faq-editorial summary:hover .faq-q{color:var(--accent)}
.faq-editorial .faq-n{
  font-family:"Fraunces";font-weight:300;
  font-size:14px;color:var(--muted);letter-spacing:.08em;
}
.faq-editorial .faq-q{
  font-family:"Fraunces";font-weight:500;
  font-size:clamp(18px,2.2vw,28px);
  line-height:1.2;letter-spacing:-.025em;
  color:var(--ink);transition:.2s;
}
.faq-editorial .faq-icon{
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--ink);
  display:grid;place-items:center;font-size:14px;
  transition:.3s;
}
.faq-editorial [open] .faq-icon{background:var(--accent);color:#fff;border-color:var(--accent);transform:rotate(45deg)}
.faq-editorial .faq-a{
  padding:0 0 32px 84px;
  font-size:15px;line-height:1.8;color:var(--muted);
  max-width:820px;
}

/* === CONTACT === */
.contact-block{
  padding:100px 0;
  border-top:1px solid var(--ink);
  display:grid;grid-template-columns:1fr 1fr;gap:60px;
  align-items:start;
}
.contact-block .cta-title{
  font-family:"Fraunces";font-weight:400;
  font-size:clamp(36px,6vw,90px);
  line-height:.95;letter-spacing:-.045em;color:var(--ink);
}
.contact-block .cta-title .italic{font-style:italic;font-weight:300;color:var(--accent)}
.contact-info{display:flex;flex-direction:column;gap:32px}
.contact-info .item{
  padding-bottom:24px;border-bottom:1px solid var(--line);
}
.contact-info .item .label{
  font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px;
}
.contact-info .item .value{
  font-family:"Fraunces";font-weight:400;
  font-size:clamp(22px,3vw,36px);line-height:1.15;
  letter-spacing:-.025em;color:var(--ink);
}
.contact-info .item a{display:inline-flex;align-items:center;gap:12px;transition:.2s}
.contact-info .item a:hover{color:var(--accent)}

/* === BIG BUTTON === */
.btn-huge{
  display:inline-flex;align-items:center;gap:16px;
  padding:22px 40px;
  background:var(--ink);color:var(--bg);
  font-family:"Fraunces";font-weight:500;
  font-size:clamp(16px,1.6vw,22px);
  letter-spacing:-.02em;
  border-radius:99px;
  transition:.3s cubic-bezier(.22,1,.36,1);
  margin-top:32px;
}
.btn-huge:hover{background:var(--accent);transform:translateY(-3px)}
.btn-huge .circle{
  width:34px;height:34px;border-radius:50%;
  background:var(--bg);color:var(--ink);
  display:grid;place-items:center;font-size:16px;
  transition:.3s;
}
.btn-huge:hover .circle{background:var(--ink);color:var(--bg);transform:translateX(4px)}

/* === FOOTER === */
footer{
  background:var(--ink);color:var(--bg);
  padding:60px 0 40px;
  border-top:1px solid var(--ink);
}
footer .marquee{
  font-family:"Fraunces";font-weight:400;
  font-size:clamp(80px,18vw,300px);
  line-height:.85;letter-spacing:-.06em;
  color:var(--bg);opacity:.08;
  white-space:nowrap;
  overflow:hidden;
  margin-bottom:40px;
  user-select:none;
}
footer .foot-bottom{
  display:flex;justify-content:space-between;
  align-items:center;gap:24px;flex-wrap:wrap;
  font-size:12px;font-weight:500;letter-spacing:.05em;
  text-transform:uppercase;opacity:.6;
}
footer .foot-links{display:flex;gap:24px}
footer .foot-links a:hover{color:var(--accent);opacity:1}

/* === REVEAL === */
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.22,1,.36,1),transform 1s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* === MODAL === */
.doc-modal{
  position:fixed;inset:0;z-index:200;
  background:rgba(15,15,15,0);
  backdrop-filter:blur(0);
  display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .4s,background .4s,backdrop-filter .4s,visibility 0s linear .4s;
}
.doc-modal.open{
  opacity:1;visibility:visible;pointer-events:auto;
  background:rgba(15,15,15,.9);backdrop-filter:blur(16px);
  transition:opacity .4s,background .4s,backdrop-filter .4s,visibility 0s;
}
.doc-modal-inner{
  background:var(--bg);max-width:1200px;width:100%;
  border-radius:0;overflow:hidden;
  display:grid;grid-template-columns:1.6fr 1fr;max-height:90vh;
  transform:scale(.94) translateY(24px);opacity:0;
  transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .4s;
  position:relative;
}
.doc-modal.open .doc-modal-inner{transform:scale(1) translateY(0);opacity:1}
.doc-modal-gallery{position:relative;background:var(--ink);display:flex;flex-direction:column}
.doc-modal-slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;flex:1}
.doc-modal-slider::-webkit-scrollbar{display:none}
.doc-modal-slide{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:var(--ink)}
.doc-modal-slide img{width:100%;height:100%;object-fit:contain;max-height:80vh}
.doc-modal-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:52px;height:52px;border-radius:50%;
  background:rgba(255,255,255,.95);color:var(--ink);font-size:20px;
  display:grid;place-items:center;z-index:3;transition:.25s;
  cursor:pointer;
}
.doc-modal-nav:hover{background:var(--accent);color:#fff}
.doc-modal-nav.prev{left:18px}
.doc-modal-nav.next{right:18px}
.doc-modal-nav:disabled{opacity:.25;cursor:not-allowed}
.doc-modal-counter{
  position:absolute;bottom:18px;left:18px;
  color:#fff;font-size:11px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;
}
.doc-modal-dots{display:flex;gap:6px;justify-content:center;padding:14px 0;background:var(--ink);flex-wrap:wrap}
.doc-modal-dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.3);border:0;cursor:pointer;transition:.25s;padding:0;
}
.doc-modal-dot.active{background:var(--accent);width:20px;border-radius:99px}
.doc-modal-info{padding:48px;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg)}
.doc-modal-tag{
  display:inline-block;
  font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--accent);
  margin-bottom:20px;
}
.doc-modal-info h2{
  font-family:"Fraunces";font-weight:500;
  font-size:clamp(24px,2.5vw,36px);
  line-height:1.15;letter-spacing:-.03em;
  color:var(--ink);margin-bottom:20px;
}
.doc-modal-info p{font-size:14px;line-height:1.8;color:var(--muted);margin-bottom:16px}
.doc-modal-close{
  position:absolute;top:20px;right:20px;
  width:44px;height:44px;border-radius:50%;
  background:var(--bg);color:var(--ink);font-size:20px;
  display:grid;place-items:center;
  z-index:5;transition:.25s;cursor:pointer;
}
.doc-modal-close:hover{background:var(--accent);color:#fff;transform:rotate(90deg)}

/* === FLOATING BUTTONS === */
.float-btn{
  position:fixed;bottom:24px;z-index:120;
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;border-radius:99px;
  background:var(--ink);color:var(--bg);
  font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;
  transition:.3s;border:0;
}
.float-btn:hover{background:var(--accent);transform:translateY(-2px)}
.float-btn.music{right:24px}
